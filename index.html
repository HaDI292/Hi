<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشاركة الملفات</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf9f5;--card:#ffffff;--line:#e8e6dc;--txt:#141413;--mut:#6b6a63;--acc:#d97757;--acc2:#c6613f;--err:#b3382c;--chip:#f0eee6}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262624;--card:#30302e;--line:#3d3d3a;--txt:#faf9f5;--mut:#b0aea5;--acc:#d97757;--acc2:#e08a6d;--err:#ff8a7a;--chip:#3a3a37}}
:root[data-theme="dark"]{--bg:#262624;--card:#30302e;--line:#3d3d3a;--txt:#faf9f5;--mut:#b0aea5;--acc:#d97757;--acc2:#e08a6d;--err:#ff8a7a;--chip:#3a3a37}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:0 16px}
main{max-width:620px;margin:0 auto;padding:30px 0 60px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;font-weight:500;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 22px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.drop{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:30px 12px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s}
.drop:hover{border-color:var(--acc)}
.drop b{display:block;color:var(--txt);margin-bottom:6px;font-weight:500}
small{color:var(--mut)}
button,select{font:inherit;color:var(--txt);background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.primary:hover{background:var(--acc2)}
button.danger{color:var(--err)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.bar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:14px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.msg{margin-top:12px;color:var(--mut);font-size:14px;min-height:18px}
.msg.err{color:var(--err)}
.link{direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;font-size:13px;margin-top:12px}
.qr{display:flex;justify-content:center;margin-top:14px}
.qr>div{background:#fff;padding:12px;border-radius:12px;line-height:0}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .a{display:flex;gap:6px;flex-shrink:0}
.item button{padding:7px 11px;font-size:13px}
.view img,.view video{width:100%;max-height:75vh;border-radius:14px;background:#000;display:block;object-fit:contain}
.audio{text-align:center;padding:20px 4px}
.big{width:104px;height:104px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:40px;line-height:1;padding:0}
.big:hover{background:var(--acc2)}
.seek{width:100%;margin-top:24px;accent-color:var(--acc)}
.time{display:flex;justify-content:space-between;direction:ltr;color:var(--mut);font-size:13px;margin-top:4px}
.fname{margin:0 0 14px;font-weight:500;word-break:break-word;font-family:Georgia,serif;font-size:18px}
.center{text-align:center;padding:30px 0}
.err{color:var(--err)}
</style>
</head>
<body>
<main id="app"></main>
<script id="state" type="application/json">{"files":[]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const PRISTINE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
const BASE = "https://claude.ai/artifact/8auFWWbXfq4iLD1D7izJgC";
const EXT = {mp3:["audio"],wav:["audio"],m4a:["audio"],aac:["audio"],mp4:["video","video/mp4"],mov:["video","video/mp4"],webm:["video","video/webm"],
  jpg:["image","image/jpeg"],jpeg:["image","image/jpeg"],png:["image","image/png"],webp:["image","image/webp"],gif:["image","image/gif"]};
const ACCEPT = Object.keys(EXT).map(e=>"."+e).join(",");
const MAX_MB = 20;
const app = document.getElementById("app");
const state = JSON.parse(document.getElementById("state").textContent || '{"files":[]}');
let assets = null, artifact = null, busy = false;

const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtT = s=>{if(!isFinite(s))return"0:00";s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const rid = (n=10)=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,b=>"abcdefghijkmnpqrstuvwxyz23456789"[b%32]).join("")};
const base = ()=> (BASE || location.href.split("#")[0]);
const shareUrl = t=>base()+"#"+t;
const hashToken = ()=>location.hash.replace(/[^a-z0-9]/gi,"");

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch{}
  try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); const ok=document.execCommand("copy"); ta.remove(); if(ok) return true; }catch{}
  return false;
}
async function doShare(t,title){
  const url = shareUrl(t);
  if(navigator.share){ try{ await navigator.share({title,url}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  (await copyText(url)) ? alert("تم نسخ الرابط") : prompt("انسخ الرابط:",url);
}
function setMsg(t,err){const m=document.getElementById("msg");if(m){m.textContent=t;m.className="msg"+(err?" err":"")}}

async function saveState(){
  const json = JSON.stringify(state).replace(/</g,"\\u003c");
  const html = PRISTINE.replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+json+b);
  await artifact.publish(html); // يعيد تحميل الصفحة بعد الحفظ
}

/* ============ صفحة المشاهدة ============ */
async function viewPage(token){
  app.innerHTML = `<div class="card view"><div class="center">جارٍ التحميل…</div></div>`;
  const box = app.querySelector(".view");
  const fail = m=>{
    box.innerHTML = `<div class="center"><p class="err">${esc(m)}</p><button id="rt">إعادة المحاولة</button></div>`;
    box.querySelector("#rt").onclick=()=>viewPage(token);
  };
  const f = state.files.find(x=>x.t===token);
  if(!f) return fail("هذا الرابط غير موجود أو تم حذف الملف.");
  if(f.exp && Date.now()>f.exp) return fail("انتهت صلاحية هذا الرابط.");
  const url = "/_blob/"+f.a;
  try{
    const r = await fetch(url,{headers:{Range:"bytes=0-0"}});
    if(!(r.status===200||r.status===206)) throw 0;
  }catch{ return fail("الملف غير متاح حاليًا. تحقق من الاتصال وحاول مجددًا."); }

  if(f.k==="image"){
    box.innerHTML = `<p class="fname">${esc(f.n)}</p><img alt="">`;
    const img = box.querySelector("img"); img.onerror=()=>fail("تعذّر تحميل الصورة."); img.src=url;
  }else if(f.k==="video"){
    box.innerHTML = `<p class="fname">${esc(f.n)}</p><video controls playsinline preload="metadata"></video>`;
    const v = box.querySelector("video"); v.onerror=()=>fail("تعذّر تشغيل الفيديو على هذا المتصفح."); v.src=url; v.load();
  }else{
    box.innerHTML = `<p class="fname">${esc(f.n)}</p>
    <div class="audio"><audio preload="metadata" playsinline></audio>
      <button class="big" id="pp" aria-label="تشغيل">▶</button>
      <input class="seek" id="sk" type="range" min="0" max="100" value="0" step="0.1" dir="ltr">
      <div class="time"><span id="ct">0:00</span><span id="du">${fmtT(f.d||0)}</span></div></div>`;
    const a = box.querySelector("audio"), pp = box.querySelector("#pp"), sk = box.querySelector("#sk");
    const dur = ()=> (isFinite(a.duration)&&a.duration>0)?a.duration:(f.d||0);
    a.onerror = ()=>fail("تعذّر تشغيل الصوت على هذا المتصفح.");
    a.onloadedmetadata = ()=>{box.querySelector("#du").textContent=fmtT(dur())};
    a.ontimeupdate = ()=>{const d=dur(); if(d) sk.value=Math.min(100,a.currentTime/d*100); box.querySelector("#ct").textContent=fmtT(a.currentTime)};
    a.onplay = ()=>{pp.textContent="❚❚"}; a.onpause = ()=>{pp.textContent="▶"}; a.onended = ()=>{pp.textContent="▶"};
    sk.oninput = ()=>{const d=dur(); if(d) a.currentTime=sk.value/100*d};
    pp.onclick = async()=>{ try{ a.paused ? await a.play() : a.pause(); }catch{ fail("لم يبدأ التشغيل. اضغط إعادة المحاولة."); } };
    a.src = url; a.load();
  }
  const bar = document.createElement("div"); bar.className="row";
  bar.innerHTML = `<button id="cp">نسخ الرابط</button><button id="sh">مشاركة</button>`;
  box.appendChild(bar);
  bar.querySelector("#cp").onclick=async e=>{(await copyText(shareUrl(token)))?e.target.textContent="تم النسخ":prompt("انسخ الرابط:",shareUrl(token))};
  bar.querySelector("#sh").onclick=()=>doShare(token,f.n);
}

/* ============ لوحة الرفع (لصاحب الصفحة) ============ */
function home(){
  app.innerHTML = `<h1>مشاركة الملفات</h1><p class="sub">ارفع ملفًا واحصل على رابط وQR يعمل لأي شخص</p>
  <div class="card">
    <label class="drop"><b>اضغط لاختيار ملف</b><small>صوت · فيديو · صور — حتى ${MAX_MB} ميغابايت</small>
      <input type="file" id="fi" accept="${ACCEPT}" hidden></label>
    <div class="row"><small>صلاحية الرابط:</small>
      <select id="ex"><option value="0">دائم</option><option value="1">يوم</option><option value="7">7 أيام</option><option value="30">30 يومًا</option></select></div>
    <div class="bar" id="bar"><i></i></div><div class="msg" id="msg"></div><div id="res"></div>
  </div>
  <div class="card" id="list"></div>`;
  document.getElementById("fi").onchange = e=>e.target.files[0]&&upload(e.target.files[0]);
  renderList();
  const last = sessionStorage.getItem("lastTok");
  if(last && state.files.some(x=>x.t===last)){ showResult(last); sessionStorage.removeItem("lastTok"); setMsg("تم الرفع بنجاح ✓"); }
}
function progress(p){const b=document.getElementById("bar");if(b){b.style.display="block";b.firstElementChild.style.width=p+"%"}}

async function audioToContainer(file){
  const url = URL.createObjectURL(file);
  const a = new Audio(); a.preload="auto"; a.src = url;
  await new Promise((res,rej)=>{a.onloadedmetadata=res;a.onerror=()=>rej(new Error("decode"))});
  const AC = window.AudioContext||window.webkitAudioContext;
  const ctx = new AC(); const src = ctx.createMediaElementSource(a); const dest = ctx.createMediaStreamDestination(); src.connect(dest);
  const mt = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  if(!mt) throw new Error("norecorder");
  const rec = new MediaRecorder(dest.stream,{mimeType:mt,audioBitsPerSecond:128000});
  const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const stopped = new Promise(r=>rec.onstop=r);
  const dur = a.duration;
  a.ontimeupdate = ()=>progress(Math.min(85,a.currentTime/dur*85));
  const ended = new Promise(r=>a.onended=r);
  rec.start(1000); await ctx.resume(); await a.play(); await ended; rec.stop(); await stopped;
  ctx.close(); URL.revokeObjectURL(url);
  return {blob:new Blob(chunks,{type:mt.startsWith("audio/mp4")?"video/mp4":"video/webm"}), dur};
}

async function upload(file){
  if(busy) return;
  const ext = (file.name.split(".").pop()||"").toLowerCase();
  const info = EXT[ext];
  if(!info) return setMsg("نوع الملف غير مدعوم.",true);
  if(file.size>MAX_MB*1048576) return setMsg(`الملف أكبر من ${MAX_MB} ميغابايت.`,true);
  busy = true; document.getElementById("res").innerHTML="";
  try{
    let blob, type, d=0, kind=info[0];
    if(kind==="audio"){
      setMsg("جارٍ تجهيز الصوت للتخزين الدائم… (يستغرق مدة الملف تقريبًا، لا تغلق الصفحة)");
      const r = await audioToContainer(file); blob=r.blob; type=blob.type; d=r.dur;
    }else{ blob=file; type=info[1]; setMsg("جارٍ الرفع…"); progress(15); }
    let t=0; const tick=setInterval(()=>{t=Math.min(t+4,88);if(kind!=="audio")progress(15+t)},300);
    let res;
    try{ res = await assets.upload(blob,{type}); } finally{ clearInterval(tick); }
    progress(95);
    const days = +document.getElementById("ex").value;
    const tok = rid(12);
    state.files.unshift({t:tok,a:res.id,k:kind,n:file.name,m:type,d,s:res.sizeBytes,exp:days?Date.now()+days*864e5:0});
    sessionStorage.setItem("lastTok",tok);
    progress(100);
    await saveState();
  }catch(e){
    const c = e&&e.code;
    setMsg(c==="too_large"?"الملف كبير جدًا.":c==="unsupported_type"?"هذا النوع غير مدعوم.":c==="quota_or_state"?"امتلأت مساحة التخزين.":c==="conflict"?"تم التحديث، أعد المحاولة.":"فشل الرفع. جرّب مرة أخرى.",true);
    const b=document.getElementById("bar"); if(b) b.style.display="none";
  }finally{ busy=false; }
}

function showResult(tok){
  const url = shareUrl(tok), res = document.getElementById("res");
  res.innerHTML = `<div class="link">${esc(url)}</div><div class="qr"><div id="qrbox"></div></div>
    <div class="row"><button class="primary" id="c1">نسخ الرابط</button><button id="s1">مشاركة</button></div>`;
  try{ new QRCode(document.getElementById("qrbox"),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M}); }catch{}
  res.querySelector("#c1").onclick=async e=>{(await copyText(url))?e.target.textContent="تم النسخ":prompt("انسخ الرابط:",url)};
  res.querySelector("#s1").onclick=()=>doShare(tok,"ملف");
}

function renderList(){
  const box = document.getElementById("list");
  if(!state.files.length){ box.innerHTML="<small>ملفاتك المرفوعة ستظهر هنا.</small>"; return; }
  box.innerHTML = "<small>ملفاتك</small>";
  state.files.forEach(f=>{
    const it = document.createElement("div"); it.className="item";
    it.innerHTML = `<span class="n">${esc(f.n)}${f.exp&&Date.now()>f.exp?" (منتهي)":""}</span><span class="a"><button data-a="q">رابط وQR</button><button class="danger" data-a="d">حذف</button></span>`;
    it.onclick = async e=>{
      const a = e.target.dataset.a; if(!a) return;
      if(a==="q"){ document.getElementById("msg").textContent=""; showResult(f.t); window.scrollTo(0,0); }
      if(a==="d"){
        if(!confirm("حذف الملف نهائيًا؟ سيتوقف الرابط عن العمل.")) return;
        try{ await assets.delete(f.a); state.files=state.files.filter(x=>x.t!==f.t); await saveState(); }
        catch{ setMsg("تعذّر حذف الملف.",true); }
      }
    };
    box.appendChild(it);
  });
}

/* ============ التشغيل ============ */
async function init(){
  const tok = hashToken();
  if(tok){ viewPage(tok); }
  else app.innerHTML = `<div class="card center"><p>جارٍ التحميل…</p></div>`;
  try{ assets = await claude.use("assets"); artifact = await claude.use("artifact"); }catch{}
  if(!tok){
    if(assets && artifact) home();
    else app.innerHTML = `<div class="card center"><h1>مشاركة الملفات</h1><p class="sub">افتح رابط مشاركة لعرض الملف.</p></div>`;
  }
}
window.addEventListener("hashchange",()=>{ const t=hashToken(); t?viewPage(t):location.reload(); });
init();
</script>
</body>
</html>
